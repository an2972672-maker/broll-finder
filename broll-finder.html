<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B-Roll Finder</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{--bg:#eef2f1;--card:#fff;--ink:#16302f;--mut:#5d7472;--acc:#0f766e;--line:#cfdcda}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Noto Nastaliq Urdu","Segoe UI",system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
h1{font-size:1.5rem;margin:8px 0 2px}
p.sub{color:var(--mut);margin:0 0 18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
label{display:block;font-size:.9rem;color:var(--mut);margin-bottom:4px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
textarea{min-height:170px;direction:auto}
input[dir=ltr],#key{direction:ltr}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:120px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:11px 18px;font:inherit;cursor:pointer}
button.alt{background:#fff;color:var(--acc);border:1px solid var(--acc)}
button:disabled{opacity:.5}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #f59e0b;outline-offset:2px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
#status{color:var(--acc);min-height:1.5em;margin:6px 0}
.scene h3{margin:0 0 6px;font-size:1rem}
.scene .txt{color:var(--mut);direction:auto;margin:0 0 8px;font-size:.92rem}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.clip{position:relative;width:130px}
.clip img{width:100%;height:80px;object-fit:cover;border-radius:6px;display:block;background:#dde7e5}
.clip small{color:var(--mut);direction:ltr;display:block}
.clip button{position:absolute;top:4px;left:4px;padding:0 7px;line-height:22px;background:#000a}
.hide{display:none}
</style>
</head>
<body>
<main>
<h1>B-Roll Finder</h1>
<p class="sub">سکرپٹ ڈالیں، سین بنائیں، کلپس ڈھونڈیں، ایک ZIP ڈاؤن لوڈ کریں۔</p>

<div class="box">
  <label for="key">Pexels API Key (مفت: pexels.com/api)</label>
  <input id="key" type="password" placeholder="یہاں ایک بار paste کریں" autocomplete="off">
</div>

<div class="box">
  <label for="script">سکرپٹ (انگریزی میں بہتر نتائج ملتے ہیں)</label>
  <textarea id="script" placeholder="Soft rain falls on a quiet window.&#10;A small cat sleeps on a warm blanket."></textarea>
  <div class="row" style="margin-top:10px">
    <div><label for="mode">سین کیسے بنیں</label>
      <select id="mode"><option value="line">ہر لائن ایک سین</option><option value="sent">ہر جملہ ایک سین</option></select></div>
    <div><label for="per">فی سین کلپس</label>
      <select id="per"><option>1</option><option selected>2</option><option>3</option></select></div>
    <div><label for="ori">سائز</label>
      <select id="ori"><option value="landscape">افقی (YouTube)</option><option value="portrait">عمودی (Shorts)</option></select></div>
  </div>
  <div class="acts"><button id="split">1. سین بنائیں</button></div>
</div>

<div id="status" role="status"></div>
<div id="scenes"></div>

<div id="tools" class="acts hide">
  <button id="find">2. کلپس ڈھونڈیں</button>
  <button id="zip" class="alt" disabled>3. ZIP ڈاؤن لوڈ کریں</button>
</div>
</main>

<script>
const $=id=>document.getElementById(id);
const STOP=new Set("the and but for with from this that these those into over under then than very just you your our they their his her not does did have has had will would can could should about there here when where who what which while were been being them also some more most only your".split(" "));
let scenes=[];
try{$('key').value=localStorage.getItem('pk')||''}catch(e){}
$('key').onchange=()=>{try{localStorage.setItem('pk',$('key').value.trim())}catch(e){}};
const st=t=>$('status').textContent=t;

function kw(t){
  const w=t.toLowerCase().replace(/[^a-z\s]/g,' ').split(/\s+/).filter(x=>x.length>3&&!STOP.has(x));
  return [...new Set(w)].slice(0,3).join(' ');
}

$('split').onclick=()=>{
  const re=$('mode').value==='line'?/\n+/:/(?<=[.!?])\s+|\n+/;
  const parts=$('script').value.split(re).map(s=>s.trim()).filter(Boolean);
  if(!parts.length){st('پہلے سکرپٹ لکھیں۔');return}
  scenes=parts.map(t=>({text:t,kw:kw(t),clips:[]}));
  render();
  $('tools').classList.remove('hide');
  $('zip').disabled=true;
  st(scenes.length+' سین بن گئے۔ چاہیں تو keywords بدلیں، پھر کلپس ڈھونڈیں۔');
};

function render(){
  const box=$('scenes');box.innerHTML='';
  scenes.forEach((s,i)=>{
    const d=document.createElement('div');d.className='box scene';
    const h=document.createElement('h3');h.textContent='سین '+(i+1);
    const p=document.createElement('p');p.className='txt';p.textContent=s.text;
    const inp=document.createElement('input');inp.dir='ltr';inp.value=s.kw;inp.placeholder='search keywords';
    inp.setAttribute('aria-label','keywords سین '+(i+1));
    inp.oninput=()=>s.kw=inp.value;
    const th=document.createElement('div');th.className='thumbs';th.id='th'+i;
    d.append(h,p,inp,th);box.appendChild(d);
    drawClips(i);
  });
}

function drawClips(i){
  const th=$('th'+i);if(!th)return;th.innerHTML='';
  scenes[i].clips.forEach((c,j)=>{
    const w=document.createElement('div');w.className='clip';
    const im=document.createElement('img');im.src=c.image;im.alt='clip '+(j+1);im.loading='lazy';
    const sm=document.createElement('small');sm.textContent=c.width+'p · '+c.dur+'s';
    const x=document.createElement('button');x.textContent='×';x.title='ہٹائیں';
    x.onclick=()=>{scenes[i].clips.splice(j,1);drawClips(i)};
    w.append(im,sm,x);th.appendChild(w);
  });
}

async function search(q,n,o){
  const r=await fetch('https://api.pexels.com/videos/search?query='+encodeURIComponent(q)+'&per_page='+n+'&orientation='+o,
    {headers:{Authorization:$('key').value.trim()}});
  if(r.status===401)throw new Error('API key غلط ہے');
  if(r.status===429)throw new Error('حد ختم، کچھ دیر بعد کوشش کریں');
  if(!r.ok)throw new Error('خرابی '+r.status);
  return (await r.json()).videos||[];
}
function pick(v){
  const f=v.video_files.filter(x=>x.file_type==='video/mp4'&&x.width);
  f.sort((a,b)=>Math.abs(Math.max(a.width,a.height)-1280)-Math.abs(Math.max(b.width,b.height)-1280));
  return f[0];
}

$('find').onclick=async()=>{
  if(!$('key').value.trim()){st('پہلے Pexels API key ڈالیں۔');return}
  $('find').disabled=true;$('zip').disabled=true;
  const per=+$('per').value,ori=$('ori').value,used=new Set();
  try{
    for(let i=0;i<scenes.length;i++){
      const s=scenes[i];s.clips=[];
      st('ڈھونڈ رہا ہوں: سین '+(i+1)+' / '+scenes.length);
      let q=(s.kw||'').trim()||'nature';
      let vids=await search(q,per+4,ori);
      if(!vids.length&&q.includes(' ')){vids=await search(q.split(' ')[0],per+4,ori)}
      for(const v of vids){
        if(s.clips.length>=per)break;
        if(used.has(v.id))continue;
        const f=pick(v);if(!f)continue;
        used.add(v.id);
        s.clips.push({id:v.id,image:v.image,link:f.link,width:Math.min(f.width,f.height),dur:v.duration});
      }
      drawClips(i);
    }
    const n=scenes.reduce((a,s)=>a+s.clips.length,0);
    st(n+' کلپس مل گئیں۔ ناپسند کلپ پر × دبائیں، پھر ZIP بنائیں۔');
    $('zip').disabled=n===0;
  }catch(e){st('مسئلہ: '+e.message)}
  $('find').disabled=false;
};

$('zip').onclick=async()=>{
  $('zip').disabled=true;
  const z=new JSZip(),log=[],miss=[];
  const total=scenes.reduce((a,s)=>a+s.clips.length,0);let n=0;
  for(let i=0;i<scenes.length;i++){
    const s=scenes[i];
    log.push('Scene '+(i+1)+': '+s.text,'Keywords: '+s.kw);
    for(let j=0;j<s.clips.length;j++){
      const name=String(i+1).padStart(2,'0')+'_'+(j+1)+'.mp4';
      st('ڈاؤن لوڈ '+(++n)+' / '+total);
      try{
        const r=await fetch(s.clips[j].link);
        if(!r.ok)throw 0;
        z.file(name,await r.blob());
        log.push('  '+name);
      }catch(e){
        miss.push(name+'  '+s.clips[j].link);
        log.push('  '+name+' (link only, see links.txt)');
      }
    }
    log.push('');
  }
  z.file('scenes.txt',log.join('\n'));
  if(miss.length)z.file('links.txt',miss.join('\n'));
  st('ZIP تیار ہو رہی ہے…');
  const b=await z.generateAsync({type:'blob'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='broll.zip';
  document.body.appendChild(a);a.click();a.remove();
  st(miss.length?'ZIP مل گئی۔ '+miss.length+' کلپس صرف لنک کی صورت میں ہیں (links.txt)۔':'ZIP ڈاؤن لوڈ ہو گئی۔');
  $('zip').disabled=false;
};
</script>
</body>
</html>
